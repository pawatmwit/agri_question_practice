<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ฝึกตอบปัญหาเกษตร ชุด E</title>
<meta name="description" content="แบบฝึกตอบปัญหาทางการเกษตร 100 ข้อ แบ่งเป็น 5 ชุด ด้านพืช สัตว์ เกษตรทั่วไป และนวัตกรรมเกษตร">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=Sarabun:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --paper:#EDF0E6; --card:#FBFCF8; --ink:#1D291D; --muted:#58634F; --line:#CBD3C0;
  --soil:#D9D2C3; --soil-edge:#B9AE98;
  --c-p:#3A7838; --c-a:#B0721A; --c-g:#7C583A; --c-i:#2C6287;
  --ok:#2C7A4C; --ok-bg:#E2EFE4; --bad:#AE3737; --bad-bg:#F6E3E0;
  --focus:#2C6287;
  --ui:"Anuphan","Noto Sans Thai","Leelawadee UI","Thonburi",system-ui,sans-serif;
  --read:"Sarabun","Noto Sans Thai","Leelawadee UI","Thonburi",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --paper:#141813; --card:#1C221B; --ink:#E3E8DC; --muted:#A1AA97; --line:#343C30;
    --soil:#2B2A24; --soil-edge:#4A4538;
    --c-p:#74B46E; --c-a:#E2A64B; --c-g:#C49C76; --c-i:#71AAD2;
    --ok:#62BE88; --ok-bg:#1E3326; --bad:#E58080; --bad-bg:#3A2222;
    --focus:#71AAD2;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:17px;line-height:1.6;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
.wrap{max-width:46rem;margin:0 auto;padding:2.5rem 1.25rem 3rem}
h1,h2,h3{font-weight:600;line-height:1.25;margin:0}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
i{font-family:var(--read);font-style:italic}

/* ---------- home ---------- */
.home-head h1{font-size:clamp(2rem,6vw,2.8rem);font-weight:700;letter-spacing:-.01em}
.home-head p{margin:.6rem 0 0;color:var(--muted);max-width:36rem}
.legend{display:flex;flex-wrap:wrap;gap:.4rem 1.1rem;margin:1.25rem 0 0;padding:0;list-style:none;font-size:.95rem}
.legend li{display:flex;align-items:center;gap:.45rem}
.dot{width:.8rem;height:.8rem;border-radius:3px;display:inline-block;flex:none}
.settings{display:flex;flex-wrap:wrap;gap:.6rem 1.5rem;margin:1.5rem 0 2rem;padding:1rem 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.switch{display:flex;align-items:center;gap:.6rem;cursor:pointer;user-select:none}
.switch input{appearance:none;width:2.5rem;height:1.45rem;border-radius:1rem;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .15s}
.switch input::after{content:"";position:absolute;top:.2rem;left:.2rem;width:1.05rem;height:1.05rem;border-radius:50%;background:var(--card);transition:transform .15s}
.switch input:checked{background:var(--c-p)}
.switch input:checked::after{transform:translateX(1.05rem)}
.sets{list-style:none;margin:0;padding:0}
.set-row{display:grid;grid-template-columns:13rem 1fr auto;align-items:center;gap:.75rem 1.25rem;padding:1.1rem 0;border-bottom:1px solid var(--line)}
.set-row h2{font-size:1.25rem}
.set-meta{font-size:.92rem;color:var(--muted);margin-top:.15rem}
.set-row .tray{grid-column:2}
.set-row .btn{grid-column:3}
@media (max-width:560px){
  .set-row{grid-template-columns:1fr auto}
  .set-row .tray{grid-column:1 / -1;grid-row:2}
  .set-row .btn{grid-column:2;grid-row:1}
}
.btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--card);border-radius:10px;padding:.55rem 1.1rem;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.15)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink);filter:none}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.other a{color:var(--ink);font-weight:600;text-underline-offset:3px}
.other strong{color:var(--ink)}
footer{margin-top:2.5rem;font-size:.88rem;color:var(--muted)}
footer p{margin:.2rem 0}

/* ---------- seed tray ---------- */
.tray{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;padding:6px;background:var(--soil-edge);border-radius:8px;max-width:20rem;width:100%}
.cell{aspect-ratio:1;border-radius:30%;background:var(--soil);position:relative;box-shadow:inset 0 2px 3px rgba(0,0,0,.18)}
.cell.ok{box-shadow:none}
.cell.ok.p{background:var(--c-p)} .cell.ok.a{background:var(--c-a)} .cell.ok.g{background:var(--c-g)} .cell.ok.i{background:var(--c-i)}
.cell.bad{background:var(--card);box-shadow:inset 0 0 0 2px var(--bad)}
.cell.bad::after{content:"";position:absolute;inset:30%;background:linear-gradient(45deg,transparent 44%,var(--bad) 44% 56%,transparent 56%),linear-gradient(-45deg,transparent 44%,var(--bad) 44% 56%,transparent 56%)}
.cell.now{box-shadow:inset 0 0 0 2.5px var(--ink)}
.tray.big{max-width:26rem}

/* ---------- quiz ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1rem}
.linkbtn{background:none;border:0;padding:.3rem 0;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.linkbtn:hover{color:var(--ink)}
.count{font-weight:600;font-variant-numeric:tabular-nums}
.timer{height:6px;border-radius:3px;background:var(--line);margin:1rem 0 0;overflow:hidden}
.timer > span{display:block;height:100%;background:var(--ink);width:100%}
.timer.low > span{background:var(--bad)}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.5rem 1.4rem 1.4rem;margin-top:1.25rem}
.qtags{display:flex;align-items:center;gap:.9rem;font-size:.92rem;color:var(--muted);margin-bottom:.75rem}
.qtags .cat{display:flex;align-items:center;gap:.4rem;color:var(--ink);font-weight:500}
.qtext{font-family:var(--read);font-size:1.32rem;line-height:1.65;font-weight:500;margin:0 0 1.25rem;outline:none}
.choices{display:grid;gap:.55rem;margin:0;padding:0;list-style:none}
.choice{display:flex;align-items:flex-start;gap:.8rem;width:100%;text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:.7rem .9rem;cursor:pointer;font-family:var(--read);font-size:1.08rem;line-height:1.5}
.choice:hover:not(:disabled){border-color:var(--ink)}
.choice .k{font-family:var(--ui);font-weight:600;min-width:1.4rem;color:var(--muted)}
.choice:disabled{cursor:default}
.choice.right{border-color:var(--ok);background:var(--ok-bg)}
.choice.right .k{color:var(--ok)}
.choice.wrong{border-color:var(--bad);background:var(--bad-bg)}
.choice.wrong .k{color:var(--bad)}
.choice.dim{opacity:.55}
.fillrow{display:flex;gap:.6rem;flex-wrap:wrap}
.fillrow input{flex:1 1 14rem;min-width:0;padding:.7rem .9rem;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);font-family:var(--read);font-size:1.1rem}
.fillrow input:focus{border-color:var(--ink);outline:none}
.fillrow input:disabled{opacity:.8}
.hint{font-size:.88rem;color:var(--muted);margin:.5rem 0 0}
.fb{margin-top:1.1rem;padding:1rem 1.1rem;border-radius:10px;border-left:5px solid var(--ok);background:var(--ok-bg)}
.fb.no{border-left-color:var(--bad);background:var(--bad-bg)}
.fb h3{font-size:1.05rem;margin-bottom:.3rem}
.fb p{margin:.25rem 0;font-family:var(--read);font-size:1.02rem}
.fb .ans{font-weight:600}
.fb .exp{color:var(--ink);opacity:.92}
.override{margin-top:.5rem;font-size:.9rem}
.nextrow{display:flex;justify-content:flex-end;margin-top:1.1rem}
.keys{font-size:.85rem;color:var(--muted);margin-top:1rem}
@media (hover:none){.keys{display:none}}

/* ---------- result ---------- */
.score{font-size:clamp(3rem,12vw,4.5rem);font-weight:700;line-height:1;margin:.6rem 0 .3rem;font-variant-numeric:tabular-nums}
.score small{font-size:.4em;font-weight:500;color:var(--muted)}
.verdict{color:var(--muted);margin:0 0 1.25rem}
.bycat{list-style:none;margin:1.5rem 0;padding:0;display:grid;gap:.6rem}
.bycat li{display:grid;grid-template-columns:8.5rem 1fr 3rem;align-items:center;gap:.8rem;font-size:.95rem}
.bar{height:.7rem;border-radius:4px;background:var(--line);overflow:hidden}
.bar span{display:block;height:100%}
.bycat .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.actions{display:flex;flex-wrap:wrap;gap:.6rem;margin:1.5rem 0 2rem}
.review h2{font-size:1.2rem;margin:0 0 .75rem}
.review ol{margin:0;padding-left:1.4rem;display:grid;gap:1rem}
.review li{font-family:var(--read);font-size:1.02rem}
.review .q{font-weight:500}
.review .yours{color:var(--bad)}
.review .right{color:var(--ok);font-weight:600}
.review .why{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="wrap" id="app" aria-live="off"></main>
<div class="sr" id="announce" aria-live="polite"></div>

<script>

/* ---------- answer checking ---------- */
const SUB = {"₀":"0","₁":"1","₂":"2","₃":"3","₄":"4","₅":"5","₆":"6","₇":"7","₈":"8","₉":"9","²":"2","³":"3"};
function norm(s){
  return String(s).normalize("NFC").toLowerCase()
    .replace(/[\u200b-\u200d\ufeff]/g,"")
    .replace(/[₀-₉²³]/g, c => SUB[c])
    .replace(/alpha/g,"a").replace(/α/g,"a")
    .replace(/[\s.,\-–—_()\[\]{}'"`\/\\:;!?%°+×·•*“”‘’]/g,"");
}
function lev(a,b){
  a=[...a]; b=[...b];
  let prev=Array.from({length:b.length+1},(_,i)=>i);
  for(let i=1;i<=a.length;i++){
    const cur=[i];
    for(let j=1;j<=b.length;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    prev=cur;
  }
  return prev[b.length];
}
QUESTIONS.forEach(q => { if(q.type==="fill"){ q.accN=q.acc.map(norm); q.rejN=(q.rej||[]).map(norm); } });
function checkFill(input,q){
  const n=norm(input);
  if(!n) return {ok:false, empty:true};
  if(q.rejN.includes(n)) return {ok:false};
  if(q.accN.includes(n)) return {ok:true};
  const digits=n.replace(/\D/g,"");
  for(const a of q.accN){
    const L=[...a].length;
    if(L<6 || a.replace(/\D/g,"")!==digits) continue;
    const d=lev(n,a);
    if(d<=1 || (L>=12 && d<=2)) return {ok:true, fuzzy:true};
  }
  return {ok:false};
}

function trayHTML(ids, results, cls="", nowIdx=-1){
  const cells = ids.map((id,k) => {
    const r = results ? results[k] : undefined;
    const st = r===true ? "ok" : r===false ? "bad" : "";
    return `<span class="cell ${byId[id].cat} ${st} ${k===nowIdx?"now":""}"></span>`;
  }).join("");
  const done = results ? results.filter(x=>x!==undefined && x!==null).length : 0;
  const right = results ? results.filter(x=>x===true).length : 0;
  const label = results ? `ตอบแล้ว ${done} ข้อ ถูก ${right} ข้อ จาก ${ids.length} ข้อ` : `ยังไม่ได้ทำ ${ids.length} ข้อ`;
  return `<div class="tray ${cls}" role="img" aria-label="${label}">${cells}</div>`;
}

    const rec = store.sets[k+1];
    const last = rec && rec.last ? ids.map(id => rec.last[id]) : null;
    const meta = rec && rec.best!=null ? `ดีที่สุด ${rec.best}/20 จากที่ทำไป ${rec.attempts} ครั้ง` : "ยังไม่ได้ทำ";
    return `<li class="set-row">
      <div><h2>${setName(k)}</h2><div class="set-meta">${meta}</div></div>
      ${trayHTML(ids, last)}
      <button class="btn" data-start="${k}">${rec && rec.best!=null ? "ทำอีกครั้ง" : "เริ่มทำ"}</button>
    </li>`;
  }).join("");
  app.innerHTML = `
    <header class="home-head">
      <h1>ฝึกตอบปัญหาเกษตร ชุด ${PREFIX}</h1>
      <p>100 ข้อ แบ่งเป็น 5 ชุดย่อย ชุดละ 20 ข้อ แต่ละชุดมีคำถามด้านพืช สัตว์ เกษตรทั่วไป และนวัตกรรมเกษตร หมวดละ 5 ข้อ ความยากใกล้เคียงกันทุกชุด เมื่อตอบแต่ละข้อจะเห็นเฉลยและคำอธิบายทันที</p>
      <p class="other">ชุดคำถามทั้งหมด: <a href="index.html">ชุด A</a> · <a href="set-b.html">ชุด B</a> · <a href="set-c.html">ชุด C</a> · <a href="set-d.html">ชุด D</a> · <strong>ชุด E</strong></p>
      <ul class="legend" aria-label="สีของหมวด">
        <li><span class="dot" style="background:var(--c-p)"></span>พืช</li>
        <li><span class="dot" style="background:var(--c-a)"></span>สัตว์</li>
        <li><span class="dot" style="background:var(--c-g)"></span>เกษตรทั่วไป</li>
        <li><span class="dot" style="background:var(--c-i)"></span>นวัตกรรมเกษตร</li>
      </ul>
    </header>
    <div class="settings">
      <label class="switch"><input type="checkbox" id="optTimer" ${store.settings.timer?"checked":""}> จับเวลา ${SECONDS} วินาทีต่อข้อ</label>
      <label class="switch"><input type="checkbox" id="optShuffle" ${store.settings.shuffle?"checked":""}> สลับลำดับข้อ</label>
    </div>
    <ul class="sets">${rows}</ul>
    <footer>
      <p>คณะสัตวศาสตร์และเทคโนโลยีการเกษตร มหาวิทยาลัยศิลปากร</p>
      <p>ผลการทำแบบฝึกบันทึกไว้ในเบราว์เซอร์เครื่องนี้เท่านั้น <button class="linkbtn" id="reset">ล้างผลทั้งหมด</button></p>
    </footer>`;
  app.querySelectorAll("[data-start]").forEach(b => b.onclick = () => startRun(+b.dataset.start));
  document.getElementById("optTimer").onchange = e => { store.settings.timer=e.target.checked; save(); };
  document.getElementById("optShuffle").onchange = e => { store.settings.shuffle=e.target.checked; save(); };
  document.getElementById("reset").onclick = () => {
    if(confirm("ล้างคะแนนและผลของทุกชุด?")){ store.sets={}; save(); renderHome(); }
  };
  window.scrollTo(0,0);
}

/* ---------- run ---------- */
function startRun(setIdx, onlyIds=null){
  let ids = onlyIds ? onlyIds.slice() : SETS[setIdx].slice();
  if(store.settings.shuffle) ids = shuffle(ids);
  const order = {};
  ids.forEach(id => { const q=byId[id]; if(q.type==="mc") order[id] = q.fixed ? [0,1,2,3] : shuffle([0,1,2,3]); });
  S = {setIdx, ids, order, k:0, results:Array(ids.length).fill(undefined), given:{}, review:!!onlyIds};
  renderQuestion();
}

function renderQuestion(){
  stopTimer();
  const id = S.ids[S.k], q = byId[id];
  const right = S.results.filter(x=>x===true).length;
  let body;
  if(q.type==="mc"){
    body = `<ul class="choices">${S.order[id].map((ci,pos) =>
      `<li><button class="choice" data-ci="${ci}"><span class="k">${LETTERS[pos]}.</span><span>${q.ch[ci]}</span></button></li>`).join("")}</ul>
      <p class="keys">กดปุ่ม 1–4 บนแป้นพิมพ์เพื่อเลือกคำตอบได้</p>`;
  }else{
    body = `<div class="fillrow">
        <label class="sr" for="fillIn">คำตอบ</label>
        <input id="fillIn" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="พิมพ์คำตอบ">
        <button class="btn" id="checkBtn">ตรวจคำตอบ</button>
      </div>
      <p class="hint">ตอบเป็นภาษาไทยหรืออังกฤษก็ได้ ระบบรับคำที่สะกดต่างกันเล็กน้อย</p>`;
  }
  app.innerHTML = `
    <div class="topbar">
      <button class="linkbtn" id="quit">กลับไปเลือกชุด</button>
      <span class="count">${S.review?"ทบทวนข้อที่ผิด":setName(S.setIdx)} ข้อ ${S.k+1}/${S.ids.length} <span class="sr">ตอบถูกแล้ว ${right} ข้อ</span></span>
    </div>
    ${trayHTML(S.ids, S.results, "big", S.k)}
    ${store.settings.timer ? `<div class="timer" id="timer"><span></span></div>` : ""}
    <section class="qcard">
      <div class="qtags"><span class="cat"><span class="dot" style="background:var(--c-${q.cat})"></span>${CAT[q.cat]}</span><span>ระดับ${LVL[q.lvl]}</span><span>${q.type==="mc"?"ปรนัย":"เติมคำ"}</span></div>
      <h2 class="qtext" id="qtext" tabindex="-1">${q.q}</h2>
      ${body}
      <div id="fb" aria-live="polite"></div>
      <div class="nextrow" id="nextrow" hidden><button class="btn" id="nextBtn">${S.k===S.ids.length-1?"ดูผลชุดนี้":"ข้อต่อไป"}</button></div>
    </section>`;
  document.getElementById("quit").onclick = () => { if(S.results.some(x=>x!==undefined) && !confirm("ออกจากชุดนี้? คำตอบที่ทำไปแล้วจะไม่ถูกบันทึก")) return; renderHome(); };
  if(q.type==="mc"){
    app.querySelectorAll(".choice").forEach(b => b.onclick = () => answerMC(+b.dataset.ci));
  }else{
    const inp=document.getElementById("fillIn");
    document.getElementById("checkBtn").onclick = () => answerFill(inp.value);
    inp.focus();
  }
  if(q.type==="mc") document.getElementById("qtext").focus({preventScroll:true});
  document.getElementById("nextBtn").onclick = next;
  if(store.settings.timer) startTimer();
  window.scrollTo({top:0});
}

function startTimer(){
  const bar=document.querySelector("#timer > span"), wrap=document.getElementById("timer");
  const t0=performance.now();
  tick=setInterval(() => {
    const left=Math.max(0, SECONDS - (performance.now()-t0)/1000);
    bar.style.width=(left/SECONDS*100)+"%";
    wrap.classList.toggle("low", left<=5);
    if(left<=0){
      stopTimer();
      const q=byId[S.ids[S.k]];
      if(q.type==="mc") answerMC(null, true);
      else answerFill(document.getElementById("fillIn").value, true);
    }
  }, 100);
}

function answerMC(ci, timedOut=false){
  if(S.results[S.k]!==undefined) return;
  stopTimer();
  const id=S.ids[S.k], q=byId[id], ok = ci===q.ans;
  S.results[S.k]=ok; S.given[id]= ci==null ? null : q.ch[ci];
  app.querySelectorAll(".choice").forEach(b => {
    const c=+b.dataset.ci; b.disabled=true;
    if(c===q.ans) b.classList.add("right");
    else if(c===ci) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  showFeedback(q, ok, {timedOut});
}

function answerFill(val, timedOut=false){
  if(S.results[S.k]!==undefined) return;
  const id=S.ids[S.k], q=byId[id];
  const r=checkFill(val,q);
  if(r.empty && !timedOut){ document.getElementById("fillIn").focus(); return; }
  stopTimer();
  S.results[S.k]=r.ok; S.given[id]=val.trim();
  document.getElementById("fillIn").disabled=true;
  document.getElementById("checkBtn").disabled=true;
  showFeedback(q, r.ok, {timedOut, fuzzy:r.fuzzy, typed:val.trim()});
}

function showFeedback(q, ok, {timedOut=false, fuzzy=false, typed=""}={}){
  const fb=document.getElementById("fb");
  const ansText = q.type==="mc" ? q.ch[q.ans] : q.ans;
  let head = ok ? (fuzzy ? "ถูกต้อง (สะกดต่างจากเฉลยเล็กน้อย)" : "ถูกต้อง") : (timedOut ? "หมดเวลา" : "ยังไม่ถูก");
  let html = `<div class="fb ${ok?"":"no"}"><h3>${head}</h3>`;
  if(!ok && q.type==="fill" && typed) html += `<p>คุณตอบ: ${esc(typed)}</p>`;
  html += `<p class="ans">เฉลย: ${ansText}</p><p class="exp">${q.exp}</p>`;
  if(!ok && q.type==="fill" && typed) html += `<div class="override"><button class="linkbtn" id="overrideBtn">คำตอบของฉันมีความหมายเดียวกับเฉลย นับว่าถูก</button></div>`;
  html += `</div>`;
  fb.innerHTML = html;
  announce(`${head} เฉลย ${strip(ansText)}`);
  const ob=document.getElementById("overrideBtn");
  if(ob) ob.onclick = () => {
    S.results[S.k]=true;
    const box=fb.querySelector(".fb"); box.classList.remove("no");
    box.querySelector("h3").textContent="นับว่าถูก";
    ob.parentElement.remove();
    refreshTray();
  };
  refreshTray();
  document.getElementById("nextrow").hidden=false;
  document.getElementById("nextBtn").focus({preventScroll:true});
}

function refreshTray(){
  const t=app.querySelector(".tray.big");
  if(t) t.outerHTML = trayHTML(S.ids, S.results, "big", S.k);
}

function next(){
  if(S.k < S.ids.length-1){ S.k++; renderQuestion(); }
  else renderResult();
}

/* ---------- result ---------- */
function renderResult(){
  stopTimer();
  const n=S.ids.length, right=S.results.filter(x=>x===true).length;
  if(!S.review){
    const key=S.setIdx+1, rec=store.sets[key] || {best:null, attempts:0};
    rec.attempts=(rec.attempts||0)+1;
    rec.best = rec.best==null ? right : Math.max(rec.best, right);
    rec.last = Object.fromEntries(S.ids.map((id,k)=>[id, S.results[k]===true]));
    store.sets[key]=rec; save();
  }
  const pct=right/n;
  const verdict = S.review ? "รอบทบทวนนี้ไม่นับเป็นคะแนนของชุด"
    : pct>=0.9 ? "พร้อมแข่งแล้ว ลองชุดถัดไปได้เลย"
    : pct>=0.7 ? "ดีมาก ทบทวนข้อที่พลาดอีกนิด"
    : pct>=0.5 ? "ผ่านครึ่งแล้ว อ่านคำอธิบายของข้อที่ผิดแล้วลองใหม่"
    : "อ่านคำอธิบายด้านล่าง แล้วลองทำชุดนี้อีกรอบ";
  const cats = ["p","a","g","i"].map(c => {
    const idx=S.ids.map((id,k)=>k).filter(k=>byId[S.ids[k]].cat===c);
    if(!idx.length) return "";
    const r=idx.filter(k=>S.results[k]===true).length;
    return `<li><span>${CAT[c]}</span><span class="bar"><span style="width:${r/idx.length*100}%;background:var(--c-${c})"></span></span><span class="n">${r}/${idx.length}</span></li>`;
  }).join("");
  const wrongIds = S.ids.filter((id,k)=>S.results[k]!==true);
  const review = wrongIds.map(id => {
    const q=byId[id], g=S.given[id];
    const ans = q.type==="mc" ? q.ch[q.ans] : q.ans;
    const yours = g==null || g==="" ? "ไม่ได้ตอบ" : (q.type==="mc" ? g : esc(g));
    return `<li><div class="q">${q.q}</div><div class="yours">คุณตอบ: ${yours}</div><div class="right">เฉลย: ${ans}</div><div class="why">${q.exp}</div></li>`;
  }).join("");
  app.innerHTML = `
    <div class="topbar"><button class="linkbtn" id="home">กลับไปเลือกชุด</button></div>
    <h1>${S.review ? "ทบทวนข้อที่ผิดเสร็จแล้ว" : setName(S.setIdx)+" เสร็จแล้ว"}</h1>
    <p class="score">${right}<small> / ${n}</small></p>
    <p class="verdict">${verdict}</p>
    ${trayHTML(S.ids, S.results, "big")}
    <ul class="bycat">${cats}</ul>
    <div class="actions">
      ${wrongIds.length ? `<button class="btn" id="retryWrong">ทบทวนเฉพาะข้อที่ผิด (${wrongIds.length} ข้อ)</button>` : ""}
      <button class="btn ${wrongIds.length?"ghost":""}" id="again">ทำ${setName(S.setIdx)} ใหม่ทั้งชุด</button>
      ${S.setIdx<SETS.length-1 ? `<button class="btn ghost" id="nextSet">ไป${setName(S.setIdx+1)}</button>` : ""}
    </div>
    ${wrongIds.length ? `<section class="review"><h2>ข้อที่ยังตอบไม่ถูก</h2><ol>${review}</ol></section>` : ""}`;
  const setIdx=S.setIdx;
  document.getElementById("home").onclick=renderHome;
  document.getElementById("again").onclick=()=>startRun(setIdx);
  const rw=document.getElementById("retryWrong"); if(rw) rw.onclick=()=>startRun(setIdx, wrongIds);
  const ns=document.getElementById("nextSet"); if(ns) ns.onclick=()=>startRun(setIdx+1);
  announce(`ได้ ${right} จาก ${n} ข้อ`);
  window.scrollTo(0,0);
}

/* ---------- keyboard ---------- */
document.addEventListener("keydown", e => {
  if(!S || e.altKey || e.ctrlKey || e.metaKey) return;
  const q = byId[S.ids[S.k]];
  const answered = S.results[S.k]!==undefined;
  if(!answered && q && q.type==="mc" && /^[1-4]$/.test(e.key)){
    const btn = app.querySelectorAll(".choice")[+e.key-1];
    if(btn) btn.click();
  }else if(e.key==="Enter"){
    if(!answered && q && q.type==="fill" && document.activeElement && document.activeElement.id==="fillIn"){
      e.preventDefault(); document.getElementById("checkBtn").click();
    }else if(answered && document.getElementById("nextBtn") && document.activeElement && document.activeElement.id!=="overrideBtn"){
      e.preventDefault(); next();
    }
  }
});

renderHome();
</script>
</body>
</html>
